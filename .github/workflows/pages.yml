name: Hugo · GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  HUGO_VERSION: '0.162.1'

jobs:
  website-build-deploy:
    name: Build and Deploy Website
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          ref: ${{ gitea.sha }}
          fetch-depth: 0

      - name: Install latest Hugo Extended
        run: |
          HUGO_LATEST=$(curl -s https://api.github.com/repos/gohugoio/hugo/releases/latest \
                        | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
          echo "Installing Hugo $HUGO_LATEST"

          wget https://github.com/gohugoio/hugo/releases/download/v$HUGO_LATEST/hugo_extended_${HUGO_LATEST}_Linux-64bit.tar.gz
          tar -xzf hugo_extended_${HUGO_LATEST}_Linux-64bit.tar.gz
          sudo mv hugo /usr/local/bin/
          hugo version

      - name: Build Hugo site
        run: |
          cd website
          sudo apt-get update
          sudo apt-get install -y nodejs npm
          npm install postcss postcss-cli autoprefixer --save-dev
          npm install @tryghost/content-api js-yaml fs-extra dotenv jsdom flowbite node-fetch
          chmod -R 777 .
          hugo --minify --gc --cleanDestinationDir

      - name: Upload website artifact
        uses: actions/upload-artifact@v3
        with:
          name: website-public
          path: website/public/**

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy via FTP
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_HOSTNAME: ${{ secrets.FTP_HOSTNAME }}
        run: |
          cd website/public
          lftp -u "$FTP_USER","$FTP_PASSWORD" $FTP_HOSTNAME -e "
            set ssl:verify-certificate no;
            mirror -R --delete --verbose . /public_html/openmemento.de/;
            quit"