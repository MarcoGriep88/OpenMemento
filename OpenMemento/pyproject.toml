[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "openmemento-family-video-editor"
version = "0.2.0"
description = "Lokaler Familienvideo-Editor mit KI-gestützter Highlight-Auswahl"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6~=6.11.0",
    "keyring>=25.6,<27",
    "SecretStorage>=3.3,<4; sys_platform == 'linux'",
    "imageio-ffmpeg~=0.6.0",
    "opencv-python~=4.13.0",
]

[project.optional-dependencies]
dev = ["pytest~=8.4.0"]

[project.scripts]
openmemento = "memento.app:main"
memento = "memento.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memento = ["resources/*.svg", "resources/*.ico", "resources/*.png", "resources/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
faulthandler_timeout = 60
